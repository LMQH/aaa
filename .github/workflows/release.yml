name: release

# 发版门：tag 由 scripts/release.py 创建，CI 不创建 tag。
# 只响应手动 dispatch + confirm=RELEASE；build 在 environment: release 审批后执行；
# draft-release 只建草稿，正式发布由 owner 手动点击。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且经 owner 确认的版本 tag（如 v0.3.0）
        required: true
      confirm:
        description: 输入 RELEASE 才允许构建
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  preflight:
    if: github.event.inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
      - name: Verify tag
        run: |
          test "$(git cat-file -t "$TAG")" = "tag" || { echo "$TAG 不是 annotated tag"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TAG^{commit}" origin/main || { echo "$TAG 不在 main 祖先链上"; exit 1; }
      - name: Preflight
        run: |
          uv sync --frozen --extra embedding
          ./tests/run.sh

  build:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
      - name: Build
        run: uv build
      - name: Verify version equals tag
        run: |
          version=$(unzip -p dist/*.whl '*/METADATA' | sed -n 's/^Version: //p')
          test "$version" = "${TAG#v}" || { echo "版本 $version 与 tag $TAG 不一致"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Install smoke (ubuntu)
        run: |
          uv tool install --force dist/*.whl
          aaa --version

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: Build and install
        run: |
          uv build
          cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
          cd ..
          sh scripts/install.sh --wheel dist/*.whl
          aaa --version

  draft-release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.13"
      - name: Resolve tag
        run: echo "TAG=${{ github.event.inputs.tag }}" >> "$GITHUB_ENV"
      - name: Build
        run: uv build
      - name: Checksums
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --title "$TAG" --generate-notes \
            dist/*.whl dist/*.tar.gz scripts/install.sh dist/SHA256SUMS
