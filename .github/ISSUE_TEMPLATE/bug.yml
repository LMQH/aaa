name: Bug 报告
description: 可复现的问题
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为与预期行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aaa 版本
      description: 输出 `aaa --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options:
        - macOS
        - Linux
        - WSL
        - Windows（未验证）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 请去掉密钥、令牌与个人路径
      render: text
